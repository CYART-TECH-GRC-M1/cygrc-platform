name: Secret Scan

on:
  push:
    branches:
      - main
      - develop
      - "m2-develop-dfir"
      - "feature/**"
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scan
        run: |
          gitleaks detect \
            --no-banner \
            --config .gitleaks.toml \
            --exit-code 1 \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif
        # exit-code 1 → job fails if a leak is found
        # --redact  → masks secret values in log output (never print credentials)

      - name: Upload SARIF report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-report
          path: gitleaks-report.sarif
          retention-days: 7
