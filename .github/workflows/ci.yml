name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (if Python code exists)
        run: |
          if find . -name "*.py" | grep -q .; then
          ruff check .
          else
          echo "No Python files found. Skipping lint."
          fi
