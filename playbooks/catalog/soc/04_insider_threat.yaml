id: "pb-soc-insider-threat"
version: "1.0.0"
name: "Insider Threat & Data Exfiltration Triage"
discipline: "SOC"
status: "ACTIVE"
description: "Statistical UEBA anomaly detection, access log audit, privileged session suspension, and digital evidence custody preservation."
intended_use: "Execute when high volume data access, abnormal hours activity, or credential misuse is flagged by UEBA."
preconditions:
  - check: "user_identifier_provided"
    condition: "is_not_empty"
authorized_target_types:
  - "user_id"
  - "email"
  - "case"
  - "alert"
required_permissions:
  - "playbook:execute"
inputs:
  user_id:
    type: "string"
    required: true
    description: "Account username or UUID under suspicion"
  case_id:
    type: "string"
    required: false
    description: "Linked incident case ID"
steps:
  - id: "step_1_evaluate_ueba"
    name: "Evaluate Activity against Statistical Baseline"
    action: "evaluate_ueba_baseline"
    classification: "READ_ONLY"
    requires_approval: false
    approval_role: "SOC Lead"
    input_mapping:
      user_id: "${inputs.user_id}"
    timeout_seconds: 30
    retry_policy:
      max_retries: 2
      backoff_seconds: 1.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "UEBA_ANOMALY_SCORE"
    ignore_failure: false

  - id: "step_2_audit_access_logs"
    name: "Audit User Data Access History"
    action: "audit_log_query"
    classification: "READ_ONLY"
    requires_approval: false
    approval_role: "SOC Lead"
    input_mapping:
      actor: "${inputs.user_id}"
    timeout_seconds: 45
    retry_policy:
      max_retries: 1
      backoff_seconds: 1.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "ACCESS_AUDIT_LOG"
    ignore_failure: false

  - id: "step_3_suspend_user"
    name: "Suspend User Sessions and Revoke Tokens"
    action: "suspend_user_simulation"
    classification: "SENSITIVE_DISRUPTIVE"
    requires_approval: true
    approval_role: "Tenant Admin"
    input_mapping:
      user_id: "${inputs.user_id}"
    timeout_seconds: 60
    retry_policy:
      max_retries: 2
      backoff_seconds: 2.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "SESSION_REVOCATION_LOG"
    ignore_failure: false

  - id: "step_4_escalate_case"
    name: "Escalate Incident Case with Lead Sign-off"
    action: "transition_case_status"
    classification: "REVERSIBLE_LOW_RISK"
    requires_approval: false
    approval_role: "SOC Lead"
    input_mapping:
      case_id: "${inputs.case_id}"
      target_status: "CONTAINED"
    timeout_seconds: 30
    retry_policy:
      max_retries: 1
      backoff_seconds: 1.0
    evidence_requirements:
      record_evidence: false
    ignore_failure: false

success_conditions:
  - "all_required_steps_succeeded"
failure_conditions:
  - "any_critical_step_failed"
audit_metadata:
  author: "CyGRC SecOps Architecture"
  created_at: "2026-10-13T00:00:00Z"
  updated_at: "2026-10-13T00:00:00Z"
  tags:
    - "insider-threat"
    - "ueba"
    - "identity"
  compliance_mappings:
    - framework: "NIST SP 800-53"
      control: "AC-2"
    - framework: "ISO 27001"
      control: "A.9.2.6"
  references:
    - "https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final"

