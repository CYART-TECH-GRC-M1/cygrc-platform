id: "pb-soc-phishing"
version: "1.0.0"
name: "Phishing Triage & Domain Remediation"
discipline: "SOC"
status: "ACTIVE"
description: "Phishing campaign analysis, domain reputation verification, malicious sender blocking, and mailbox purge."
intended_use: "Execute when fraudulent or credential harvesting emails are reported by users or detected by secure email gateways."
preconditions:
  - check: "sender_or_url_provided"
    condition: "is_not_empty"
authorized_target_types:
  - "email"
  - "domain"
  - "url"
  - "alert"
  - "case"
required_permissions:
  - "playbook:execute"
inputs:
  sender_email:
    type: "string"
    required: true
    description: "Suspicious sender email address"
  phishing_url:
    type: "string"
    required: false
    description: "Extracted phishing credential harvester URL"
  case_id:
    type: "string"
    required: false
    description: "Linked incident case ID"
steps:
  - id: "step_1_extract_iocs"
    name: "Extract and Validate Email IOCs"
    action: "extract_email_iocs"
    classification: "READ_ONLY"
    requires_approval: false
    approval_role: "SOC Lead"
    input_mapping:
      email: "${inputs.sender_email}"
      url: "${inputs.phishing_url}"
    timeout_seconds: 30
    retry_policy:
      max_retries: 1
      backoff_seconds: 1.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "EXTRACTED_IOCS"
    ignore_failure: false

  - id: "step_2_threat_intel"
    name: "Query Threat Intel on Sender Domain"
    action: "threat_intel_lookup"
    classification: "READ_ONLY"
    requires_approval: false
    approval_role: "SOC Lead"
    input_mapping:
      indicator: "${inputs.sender_email}"
    timeout_seconds: 30
    retry_policy:
      max_retries: 2
      backoff_seconds: 1.0
    evidence_requirements:
      record_evidence: false
    ignore_failure: false

  - id: "step_3_block_domain"
    name: "Block Malicious Sender Domain on Gateway"
    action: "block_sender_domain"
    classification: "SENSITIVE_DISRUPTIVE"
    requires_approval: true
    approval_role: "SOC Lead"
    input_mapping:
      domain: "${inputs.sender_email}"
    timeout_seconds: 60
    retry_policy:
      max_retries: 2
      backoff_seconds: 2.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "GATEWAY_BLOCK_CONFIRMATION"
    ignore_failure: false

  - id: "step_4_purge_messages"
    name: "Purge Malicious Messages Across Tenant Mailboxes"
    action: "purge_mailbox_items"
    classification: "DESTRUCTIVE"
    requires_approval: true
    approval_role: "SOC Lead"
    input_mapping:
      sender: "${inputs.sender_email}"
    timeout_seconds: 90
    retry_policy:
      max_retries: 1
      backoff_seconds: 2.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "PURGE_RECEIPT"
    ignore_failure: false

  - id: "step_5_evidence_record"
    name: "Record Evidence in Chain of Custody Ledger"
    action: "record_evidence_entry"
    classification: "REVERSIBLE_LOW_RISK"
    requires_approval: false
    approval_role: "SOC Lead"
    parameters:
      item_description: "Phishing attack IOC bundle and remediation logs"
    timeout_seconds: 30
    retry_policy:
      max_retries: 2
      backoff_seconds: 1.0
    evidence_requirements:
      record_evidence: true
      evidence_type: "CUSTODY_RECORD"
    ignore_failure: false

success_conditions:
  - "all_required_steps_succeeded"
failure_conditions:
  - "any_critical_step_failed"
audit_metadata:
  author: "CyGRC SecOps Architecture"
  created_at: "2026-10-13T00:00:00Z"
  updated_at: "2026-10-13T00:00:00Z"
  tags:
    - "phishing"
    - "soc"
    - "email-security"
  compliance_mappings:
    - framework: "NIST SP 800-61"
      control: "IR-4"
    - framework: "ISO 27001"
      control: "A.13.2.1"
  references:
    - "https://attack.mitre.org/techniques/T1566/"

