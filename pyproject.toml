[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "__pycache__",
    "database/migrations",
    "backend/alembic/versions",
    "run_*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"backend/tests/*" = ["F401", "F841"]
"scripts/*" = ["F401", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
